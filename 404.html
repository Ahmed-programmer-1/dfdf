<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>الصفحة غير موجودة</title>
<script>
/* hub.html اتقسم لصفحات مستقلة — الروابط القديمة المحفوظة بتتحوّل تلقائيًا */
(function(){var p=location.pathname,base=p.replace(/[^\/]*$/,''),q=new URLSearchParams(location.search);
if(/\/hub\.html$/.test(p)){var t=q.get('tab')||'notifications',m={notifications:'notifications.html',polls:'polls.html',schedule:'schedule.html',suggestions:'suggestions.html',mylists:'mylists.html'+(q.get('list')?'?list='+encodeURIComponent(q.get('list')):'')};
location.replace(base+(m[t]||'notifications.html'));}})();
</script>

</head><body><div><h1>🤔 الصفحة دي مش موجودة</h1><p>ممكن الرابط اتغيّر.</p><a href="index.html">الرجوع للرئيسية</a></div></body></html>
